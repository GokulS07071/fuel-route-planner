[project]
name = "fuel-route-planner"
version = "1.0.0"
description = "Django API for cost-effective US fuel stops"
requires-python = ">=3.12"
dependencies = ["Django==6.1.2", "requests>=2.32.5,<3"]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
